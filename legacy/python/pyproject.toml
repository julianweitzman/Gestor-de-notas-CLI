[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestor-de-tarjetas-cli-legacy"
version = "0.1.0"
description = "CLI Python archivada para referencia durante la migración a C#"
requires-python = ">=3.11"
dependencies = ["gestor-de-tarjetas==0.1.0", "typer>=0.12,<1", "prompt-toolkit>=3.0.43,<4", "rich>=13,<15"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
notas = "gestor_notas_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gestor_notas_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
